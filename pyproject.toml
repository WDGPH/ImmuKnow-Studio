[project]
name = "immuknow-studio-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ImmuKnow", "PyYAML", "immuknow-template-resources"]

[tool.uv]
package = false

[tool.uv.sources]
immuknow = { git = "https://github.com/WDGPH/ImmuKnow.git", rev = "60c23c6cafdbbce8b299b55f3fd2d170d1c6141d" }

immuknow-template-resources = { git = "https://github.com/WDGPH/ImmuKnow-Template.git", rev = "21fb808907a86153801bde7b1c0af751faccc8c3" }

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "prek",
    "ty>=0.0.89",
]
browser = [
    "pillow>=13.0.0",
    "pymupdf==1.28.2",
    "pypdf",
    "zxing-cpp==3.1.1",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.3",
]
