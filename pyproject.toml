[project]
name = "immuknow-studio-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML", "immuknow-template-resources"]

[tool.uv]
package = false

[tool.uv.sources]
immuknow-template-resources = { git = "https://github.com/WDGPH/ImmuKnow-Template.git", rev = "e521d910958ae37ab3ca30549b58edef3fc401c9" }

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "prek",
    "ty>=0.0.99",
]
browser = [
    "pillow>=13.0.0",
    "pymupdf==2.1",
    "pypdf",
    "zxing-cpp==3.1.1",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.0",
    "pymdown-extensions==12.3",
]
