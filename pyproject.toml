[project]
name = "immuknow-studio-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ImmuKnow", "PyYAML"]

[tool.uv]
package = false

[tool.uv.sources]
immuknow = { git = "https://github.com/WDGPH/ImmuKnow.git", tag = "v2.0.0-rc1" }

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "ty>=0.0.89",
]
browser = [
    "pillow>=13.0.0",
    "pymupdf==1.28.2",
    "pypdf",
    "zxing-cpp==3.1.1",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.3",
]
