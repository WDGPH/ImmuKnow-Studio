[project]
name = "immuknow-studio-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ImmuKnow", "PyYAML", "immuknow-template-resources"]

[tool.uv]
package = false

[tool.uv.sources]
immuknow = { git = "https://github.com/WDGPH/ImmuKnow.git", rev = "1476fba70662e2145187e31c0f9c897d3e5eaada" }

immuknow-template-resources = { git = "https://github.com/WDGPH/ImmuKnow-Template.git", rev = "a2f7e8fb78975c8b15c5c478d6de59022e154243" }

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "prek",
    "ty>=0.0.95",
]
browser = [
    "pillow>=13.0.0",
    "pymupdf==2.0",
    "pypdf",
    "zxing-cpp==3.1.1",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.0",
    "pymdown-extensions==12.3",
]
