[project]
name = "immuknow-studio-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ImmuKnow", "PyYAML", "immuknow-template-resources"]

[tool.uv]
package = false

[tool.uv.sources]
immuknow = { git = "https://github.com/WDGPH/ImmuKnow.git", rev = "014a1a33e3385cebd0d4a8ae123d05ec9541a923" }

immuknow-template-resources = { git = "https://github.com/WDGPH/ImmuKnow-Template.git", rev = "ab3b2884555cf6fa099cbe5a75a3c71fab9b78cd" }

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "prek",
    "ty>=0.0.89",
]
browser = [
    "pillow>=13.0.0",
    "pymupdf==1.28.2",
    "pypdf",
    "zxing-cpp==3.1.1",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.3",
]
