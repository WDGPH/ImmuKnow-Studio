[project]
name = "immuknow-studio-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ImmuKnow", "PyYAML", "immuknow-template-resources"]

[tool.uv]
package = false

[tool.uv.sources]
immuknow = { git = "https://github.com/WDGPH/ImmuKnow.git", rev = "499dd2a2a04e6d621e3720a4f0fe618727cf1bd5" }

immuknow-template-resources = { git = "https://github.com/WDGPH/ImmuKnow-Template.git", rev = "9c516d3fd2db100c2891f4c60f4332c9a7acbc4e", subdirectory = "package" }

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "prek",
    "ty>=0.0.89",
]
browser = [
    "pillow>=13.0.0",
    "pymupdf==1.28.2",
    "pypdf",
    "zxing-cpp==3.1.1",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.3",
]
