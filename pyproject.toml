[project]
name = "immuknow-studio-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ImmuKnow", "PyYAML", "immuknow-template-resources"]

[tool.uv]
package = false

[tool.uv.sources]
immuknow = { git = "https://github.com/WDGPH/ImmuKnow.git", rev = "83045ed36eb01ce25fb5b15fd2506d5abd1c074c" }

immuknow-template-resources = { git = "https://github.com/WDGPH/ImmuKnow-Template.git", rev = "a1e31f04661785f4b34cef468cb1f13d6d079db7" }

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "prek",
    "ty>=0.0.89",
]
browser = [
    "pillow>=13.0.0",
    "pymupdf==1.28.2",
    "pypdf",
    "zxing-cpp==3.1.1",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.3",
]
