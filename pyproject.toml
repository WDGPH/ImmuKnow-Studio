[project]
name = "immuknow-studio-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ImmuKnow", "PyYAML"]

[tool.uv]
package = false

[tool.uv.sources]
immuknow = { git = "https://github.com/WDGPH/ImmuKnow.git", tag = "v2.0.0-rc2" }

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "ty>=0.0.92",
]
browser = [
    "pillow>=13.0.0",
    "pymupdf==2.0",
    "pypdf",
    "zxing-cpp==3.1.1",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.0",
    "pymdown-extensions==12.3",
]

[tool.ruff]
extend-exclude = ["assets/project-template"]

[tool.ty.src]
exclude = ["assets/project-template"]
