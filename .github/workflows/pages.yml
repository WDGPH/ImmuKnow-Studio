name: Studio Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_immuknow:
        description: Rebuild the pinned native ImmuKnow executable instead of reusing its cache
        type: boolean
        default: false
      full_tests:
        description: Run the optional Playwright browser and native export suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: studio-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Studio
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Restore reviewed native ImmuKnow
        id: native_cache
        if: github.event_name != 'workflow_dispatch' || !inputs.refresh_immuknow
        uses: actions/cache/restore@v6
        with:
          path: .immuknow
          key: studio-native-${{ runner.os }}-${{ hashFiles('immuknow-revision.txt', 'scripts/immuknow.py') }}

      - name: Build reviewed native ImmuKnow
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          uv run --locked python -m scripts.immuknow install

      - name: Verify native executable identity
        run: uv run --locked python -c "from scripts.immuknow import identity; print(identity())"

      - name: Save reviewed native ImmuKnow
        if: steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .immuknow
          key: studio-native-${{ runner.os }}-${{ hashFiles('immuknow-revision.txt', 'scripts/immuknow.py') }}

      - name: Read compiler pins and record ImmuKnow identity
        id: immuknow
        env:
          REFRESH_IMMUKNOW: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_immuknow }}
        run: |
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.immuknow import identity

          pins = json.loads(Path("compiler-pins.json").read_text())
          immuknow = identity()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"native={immuknow['native_typst_version']}\n")
              output.write(f"rust={pins['browser_compiler']['rust_version']}\n")
              output.write(f"bindgen={pins['browser_compiler']['wasm_bindgen_version']}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## Build identity\n\n")
              summary.write(f"Studio commit: `{os.environ['GITHUB_SHA']}`\n\n")
              summary.write("ImmuKnow source: `https://github.com/WDGPH/ImmuKnow`\n\n")
              summary.write(f"ImmuKnow commit: `{immuknow['immuknow_source_revision']}`\n\n")
              summary.write(f"ImmuKnow refreshed for this run: `{os.environ['REFRESH_IMMUKNOW']}`\n\n")
              summary.write("The effective lockfile is retained in the build-inputs artifact.\n")
          PY

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record Studio version for the build
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          import { studioBuild } from "./studio-build.ts";
          const build = studioBuild(process.cwd());
          appendFileSync(process.env.GITHUB_ENV,
            `IMMUKNOW_STUDIO_BUILD_SHA=${build.revision}\nIMMUKNOW_STUDIO_BUILD_TAG=${build.tag ?? ""}\n`);
          JS

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check Python tools
        run: |
          uv run --locked --group browser ty check
          uv run --locked ruff check --no-fix .
          uv run --locked ruff format --check .
          uv run --locked python -m unittest discover -s tests -p 'test_*.py'

      - name: Restore pinned native download archives
        id: runtime_cache
        uses: actions/cache/restore@v6
        with:
          path: public/generated/runtimes
          key: studio-runtimes-${{ hashFiles('native-runtimes.json', 'immuknow-revision.txt', 'scripts/prepare_runtimes.py') }}

      - name: Prepare and verify native download archives
        run: npm run prepare:runtimes

      - name: Save pinned native download archives
        if: steps.runtime_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: public/generated/runtimes
          key: ${{ steps.runtime_cache.outputs.cache-primary-key }}

      - name: Restore prepared browser binaries and Rust notices
        id: browser_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            vendor/compiler
            vendor/renderer
          key: studio-browser-v2-${{ runner.os }}-${{ hashFiles('compiler-pins.json', 'scripts/browser_assets.py', 'scripts/build-compiler.sh', 'scripts/notices.py', 'scripts/patches/*.patch', 'licenses/*.txt') }}

      - name: Install pinned build tools on a compiler cache miss
        if: steps.browser_cache.outputs.cache-hit != 'true'
        env:
          RUST_VERSION: ${{ steps.immuknow.outputs.rust }}
          BINDGEN_VERSION: ${{ steps.immuknow.outputs.bindgen }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
          rustup toolchain install "$RUST_VERSION" --profile minimal
          archive="wasm-bindgen-${BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          release="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${BINDGEN_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output "$archive" "$release/$archive"
          curl --fail --location --retry 3 --output "$archive.sha256sum" "$release/$archive.sha256sum"
          read -r checksum _ < "$archive.sha256sum"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive"
          sudo install "${archive%.tar.gz}/wasm-bindgen" /usr/local/bin/wasm-bindgen
          test "$(wasm-bindgen --version)" = "wasm-bindgen $BINDGEN_VERSION"

      - name: Prepare browser binaries and Rust notices once per compiler identity
        if: steps.browser_cache.outputs.cache-hit != 'true'
        run: uv run --locked python -m scripts.browser_assets prepare

      - name: Verify prepared browser artifacts
        run: uv run --locked python -m scripts.browser_assets verify

      # Save before site/test gates so later failures don't discard expensive work.
      - name: Save prepared browser artifacts immediately
        if: steps.browser_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            vendor/compiler
            vendor/renderer
          key: ${{ steps.browser_cache.outputs.cache-primary-key }}

      - name: Build the standalone site without Rust
        run: npm run build:site -- --require-prepared-toolchain

      - name: Check frontend types, lint and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit

      - name: Install native Typst for optional browser tests
        if: github.event_name == 'workflow_dispatch' && inputs.full_tests
        env:
          TYPST_VERSION: ${{ steps.immuknow.outputs.native }}
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/typst.tar.xz" \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst

      - name: Run optional browser and native export tests
        if: github.event_name == 'workflow_dispatch' && inputs.full_tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Record validation and compiler cache use
        env:
          FULL_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_tests }}
          CACHE_HIT: ${{ steps.browser_cache.outputs.cache-hit == 'true' }}
        run: |
          {
            echo "## Validation"
            echo ""
            echo "Site build, Python checks, frontend types, lint and unit tests passed."
            echo ""
            echo "Optional browser/native export suite requested: $FULL_TESTS"
            echo ""
            echo "Prepared compiler cache reused: $CACHE_HIT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain effective build inputs
        if: always() && steps.immuknow.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: build-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pyproject.toml
            uv.lock
            compiler-pins.json
            native-runtimes.json
            immuknow-revision.txt
            .immuknow/identity.json
            public/generated/build.json
          retention-days: 30

      - name: Retain browser and native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-render-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy Studio
        id: deployment
        uses: actions/deploy-pages@v5
