name: Notify documentation hub

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  delete:
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    if: vars.DOCS_HUB_NOTIFY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Request the appropriate hub workflow
        env:
          GH_TOKEN: ${{ secrets.DOCS_HUB_TRIGGER_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DELETED_TYPE: ${{ github.event.ref_type }}
          DELETED_REF: ${{ github.event.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == delete ]]; then
            [[ "$DELETED_TYPE" == tag && "$DELETED_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 0
            workflow=refresh-releases.yml
          elif [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 0
            workflow=refresh-releases.yml
          else
            [[ "$REF_NAME" == main ]] || exit 0
            workflow=publish.yml
          fi
          arguments=(-f ref=main -f 'inputs[source_repo]=WDGPH/ImmuKnow-Studio')
          if [[ "$workflow" == publish.yml ]]; then
            arguments+=(-f 'inputs[deploy]=true')
          fi
          gh api --method POST "repos/WDGPH/docs/actions/workflows/$workflow/dispatches" "${arguments[@]}"
