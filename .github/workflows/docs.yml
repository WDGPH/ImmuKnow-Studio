name: Studio documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
      - name: Install locked documentation dependencies
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_READ_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then gh auth setup-git; fi
          uv sync --locked --no-default-groups --group docs
      - name: Build the source manual without building the application
        run: uv run --locked --no-default-groups --group docs mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: studio-manual
          path: site/
